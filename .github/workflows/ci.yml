# CI (HLD §12): lint → typecheck → unit/API tests → build → E2E + axe, on every PR and push to main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test # domain ≥ 80 % line coverage is enforced by packages/domain
      - run: node infra/rtm-coverage.mjs # fails if any Must FR has no automated test
      - run: pnpm build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true # reported, triaged in the release review
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            apps/web/dist
            apps/api/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ss/web build
      - run: pnpm --filter @ss/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e # API dev server (in-memory DB, fake Google) + Vite preview; journeys + axe (NFR-013)
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright, path: apps/web/test-results, retention-days: 7 }
