/* Swipe on lead rows (touch) — alternatives exist via buttons on detail page */
let sx = 0, srow = null;
document.addEventListener('touchstart', e => { srow = e.target.closest('[data-swipe]'); if (srow) sx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchmove', e => { if (srow) { const dx = e.touches[0].clientX - sx; srow.style.transform = `translateX(${Math.max(-120, Math.min(120, dx))}px)`; } }, { passive: true });
document.addEventListener('touchend', e => { if (!srow) return; const dx = e.changedTouches[0].clientX - sx; const id = srow.dataset.swipe; srow.style.transform = ''; if (dx > 90) { navigator.vibrate && !matchMedia('(prefers-reduced-motion: reduce)').matches && navigator.vibrate(10); location.hash = `#/lead/${id}`; setTimeout(() => callOutcome(id), 700); toast('Opening dialer…'); } else if (dx < -90) { location.hash = `#/lead/${id}`; setTimeout(() => waComposer(byId(S.leads, id).name), 300); } srow = null; });

/* ---------- Router ---------- */
function render() {
  const h = location.hash || '#/login'; const [, r, id] = h.split('?')[0].split('/'); const qs = new URLSearchParams(h.split('?')[1] || '');
  if (qs.get('tab')) salesTab = qs.get('tab');
  if (r === 'public') { $('#app').innerHTML = id === 'quote' ? scrPublicQuote(h.split('/')[3].split('?')[0]) : scrPublicInvoice(h.split('/')[3].split('?')[0]); }
  else if (!S.loggedIn) { $('#app').innerHTML = scrLogin(); }
  else {
    const map = { home: scrHome, leads: scrLeads, lead: () => scrLead(id), 'quote-new': () => scrQuoteBuilder(id), quote: () => scrQuote(id), invoice: () => scrInvoice(id), customers: scrCustomers, customer: () => scrCustomer(id), sales: scrSales, followups: scrFollowups, notifications: scrNotifs, settings: scrSettings, more: scrMore, reports: scrReports, login: () => { location.hash = '#/home'; return scrHome(); } };
    $('#app').innerHTML = (map[r] || (() => shell(notFound('That page doesn\'t exist.'), '')))();
    if (r === 'quote-new') renderLines();
  }
  const titles = { home: 'Home', leads: 'Leads', lead: 'Lead', 'quote-new': 'New quote', quote: 'Quote', invoice: 'Invoice', customers: 'Customers', customer: 'Customer 360', sales: 'Sales', followups: 'Follow-ups', notifications: 'Notifications', settings: 'Settings', more: 'More', reports: 'Reports', public: 'Customer view', login: 'Sign in' };
  document.title = `${titles[r] || 'SaleSphere'} · SaleSphere Prototype`;
}
let lastRoute = '';
window.addEventListener('hashchange', () => { render(); const h1 = $('#main h1') || $('#main'); h1 && h1.focus({ preventScroll: false }); try { window.scrollTo(0, 0); } catch (_) {} });
try { const t = localStorage.getItem('ss-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
setInterval(() => { if (/#\/(home|leads|lead\/)/.test(location.hash) && !$('[role=dialog]') && !document.activeElement?.matches('input,textarea,select')) render(); }, 60000);
render();
</script>
