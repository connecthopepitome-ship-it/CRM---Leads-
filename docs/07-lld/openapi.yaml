components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA, 15 min)
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-rt
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  headers:
    ETag:
      description: Record version for optimistic concurrency
      schema:
        type: string
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Version from ETag (RULE-058)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Csrf:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: SaleSphere
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MasterType:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MasterType'
    ImportKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ImportKind'
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          examples:
            - VALIDATION_FAILED
            - VERSION_CONFLICT
            - INVALID_CREDENTIALS
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        version:
          type: string
        firestore:
          type: string
        google:
          type: string
          enum:
            - connected
            - partial
            - broken
            - not_connected
        lastTickAt:
          type: string
          format: date-time
    AppConfig:
      type: object
      properties:
        appName:
          type: string
        branding:
          type: object
          properties:
            primary:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            logoLightUrl:
              type: string
            logoDarkUrl:
              type: string
        terminology:
          type: object
          additionalProperties:
            type: string
        mode:
          type: string
          enum:
            - Solo
            - Team
        modules:
          type: object
          additionalProperties:
            type: boolean
        taxMode:
          type: string
          enum:
            - GST
            - NonGST
        locale:
          type: string
        version:
          type: string
    SettingsSection:
      type: object
      properties:
        section:
          type: string
        version:
          type: integer
        data:
          type: object
          additionalProperties: true
    DocType:
      type: string
      enum:
        - quotation
        - salesOrder
        - taxInvoice
        - billOfSupply
        - proforma
        - creditNote
        - receipt
        - openingInvoice
    NumberSeries:
      type: object
      properties:
        docType:
          $ref: '#/components/schemas/DocType'
        prefix:
          type: string
        pattern:
          type: string
        padding:
          type: integer
        fyReset:
