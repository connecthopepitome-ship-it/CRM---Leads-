openapi: 3.1.0
info:
  title: SaleSphere API
  version: 0.2.0
  summary: Per-install REST API (one deployment per client).
  description: |
    Design-time contract for all LLD modules (batches 1–4).
    Conventions: docs/07-lld/LLD-common.md. Money in integer paise. Errors are RFC 7807 problem+json.
    At build time this file is regenerated from Zod (@ss/contracts).
servers:
  - url: https://crm.{client}.com/api/v1
    variables:
      client:
        default: example
tags:
  - name: platform
  - name: identity
  - name: audit
  - name: masters
  - name: leads
  - name: engagement
  - name: google
  - name: sales
  - name: payments
  - name: customers
  - name: documents
  - name: notify
  - name: insights
  - name: privacy
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - platform
      operationId: getHealth
      summary: API-001 Health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /app-config:
    get:
      tags:
        - platform
      operationId: getAppConfig
      summary: API-002 App bootstrap config (FR-003, FR-004)
      security: []
      responses:
        '200':
          description: Branding, terminology and mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
  /admin/settings/{section}:
    parameters:
      - name: section
        in: path
        required: true
        schema:
          type: string
          enum:
            - company
            - branding
            - terminology
            - mode
            - modules
            - sla
            - security
    get:
      tags:
        - platform
      operationId: getSettingsSection
      summary: API-003 Get settings section
      responses:
        '200':
          description: Section
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSection'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      tags:
        - platform
      operationId: updateSettingsSection
      summary: API-004 Update settings section
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSection'
        '400':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/number-series:
    get:
      tags:
        - platform
      operationId: listNumberSeries
      summary: API-005 List number series (FR-005)
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NumberSeries'
  /admin/number-series/{docType}:
    put:
      tags:
        - platform
      operationId: updateNumberSeries
      summary: API-006 Update number series (FR-005, RULE-003)
      parameters:
        - name: docType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocType'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefix:
                  type: string
                  pattern: ^[A-Z0-9-]{1,8}$
                padding:
                  type: integer
                  minimum: 3
                  maximum: 6
                fyReset:
                  type: boolean
                nextOverride:
                  type:
                    - integer
                    - 'null'
                  minimum: 1
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberSeries'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/about:
    get:
      tags:
        - platform
      operationId: getAbout
      summary: API-007 Version and migrations (FR-006)
      responses:
        '200':
          description: About
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  deployedAt:
                    type: string
                    format: date-time
                  migrations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        appliedAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                            - applied
                            - failed
  /jobs/{jobId}:
    get:
      tags:
        - platform
      operationId: getJob
      summary: API-008 Async job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/mode:
    post:
      tags:
        - platform
      operationId: switchMode
      summary: API-009 Switch Solo/Team (FR-004, RULE-002)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - Solo
                    - Team
      responses:
        '200':
          description: Switched
        '422':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      tags:
        - identity
      operationId: login
      summary: API-010 Sign in (FR-007, FR-008)
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Signed in, or 2FA required
          headers:
            Set-Cookie:
              description: __Secure-rt refresh cookie (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSuccess'
                  - $ref: '#/components/schemas/MfaRequired'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/2fa/verify:
    post:
      tags:
        - identity
      operationId: verifyMfa
      summary: API-011 Verify 2FA code (FR-012)
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfaToken
                - code
              properties:
                mfaToken:
                  type: string
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '401':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags:
        - identity
      operationId: refresh
      summary: API-012 Refresh access token with rotation (FR-010)
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: New access token; rotated cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    example: 900
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags:
        - identity
      operationId: logout
      summary: API-013 Sign out (FR-010)
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Signed out
  /auth/password:
    post:
      tags:
        - identity
      operationId: changePassword
      summary: API-014 Change password (FR-009)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 10
                  maxLength: 256
      responses:
        '204':
          description: Changed
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags:
        - identity
      operationId: getMe
      summary: API-015 Current user (FR-013)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /me/login-history:
    get:
      tags:
        - identity
      operationId: getLoginHistory
      summary: API-016 My login history (FR-012 AC3)
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        at:
                          type: string
                          format: date-time
                        result:
                          type: string
                          enum:
                            - success
                            - failed
                            - locked
                            - mfa_failed
                        ip:
                          type: string
                        device:
                          type: string
  /me/2fa/setup:
    post:
      tags:
        - identity
      operationId: setupMfa
      summary: API-017 Start 2FA setup
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Pending secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUrl:
                    type: string
                  qrSvg:
                    type: string
  /me/2fa/enable:
    post:
      tags:
        - identity
      operationId: enableMfa
      summary: API-018 Enable 2FA
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '204':
          description: Enabled
        '422':
          $ref: '#/components/responses/Problem'
  /me/2fa:
    delete:
      tags:
        - identity
      operationId: disableMfa
      summary: API-019 Disable 2FA
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - code
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        '204':
          description: Disabled
        '401':
          $ref: '#/components/responses/Problem'
  /admin/users:
    get:
      tags:
        - identity
      operationId: listUsers
      summary: API-020 List users (FR-011)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: teamId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextCursor:
                    type:
                      - string
                      - 'null'
    post:
      tags:
        - identity
      operationId: createUser
      summary: API-021 Create user (FR-011)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created with one-time password
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  oneTimePassword:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
        - identity
      operationId: updateUser
      summary: API-022 Update user (FR-011)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - identity
      operationId: resetPassword
      summary: API-023 Reset password (FR-011)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: One-time password
          content:
            application/json:
              schema:
                type: object
                properties:
                  oneTimePassword:
                    type: string
  /admin/users/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - identity
      operationId: deactivateUser
      summary: API-024 Deactivate with reassignment (FR-011 AC2)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reassignTo:
                  type: string
      responses:
        '202':
          description: Reassignment job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/users/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - identity
      operationId: reactivateUser
      summary: API-025 Reactivate user
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Reactivated with one-time password
        '422':
          $ref: '#/components/responses/Problem'
  /admin/users/{id}/unlock:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - identity
      operationId: unlockUser
      summary: API-026 Unlock user (FR-008 AC3)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Unlocked
  /admin/users/{id}/2fa:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags:
        - identity
      operationId: resetUserMfa
      summary: API-027 Reset a user's 2FA (FR-012 AC2)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: 2FA removed
  /admin/sessions:
    get:
      tags:
        - identity
      operationId: listSessions
      summary: API-028 Sessions of a user (FR-010 AC3)
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
  /admin/users/{id}/force-logout:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - identity
      operationId: forceLogout
      summary: API-029 Force logout (FR-010 AC3, ≤ 60 s)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Sessions revoked; epoch incremented
  /admin/roles:
    get:
      tags:
        - identity
      operationId: listRoles
      summary: API-030 List roles (FR-014)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
  /admin/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
        - identity
      operationId: updateRole
      summary: API-031 Update role limits (FR-014)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discountLimitPct:
                  type: integer
                  minimum: 0
                  maximum: 100
                recordScope:
                  type: string
                  enum:
                    - own
                    - team
                    - all
                canRecordPayments:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/teams:
    get:
      tags:
        - identity
      operationId: listTeams
      summary: API-032 List teams
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
    post:
      tags:
        - identity
      operationId: createTeam
      summary: API-033 Create team
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
        - identity
      operationId: updateTeam
      summary: API-034 Update team
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
  /admin/support-access:
    put:
      tags:
        - identity
      operationId: setSupportAccess
      summary: API-035 Enable/disable support access (FR-089)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                days:
                  type: integer
                  minimum: 1
                  maximum: 7
      responses:
        '200':
          description: Support access state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  expiresAt:
                    type:
                      - string
                      - 'null'
                    format: date-time
                  username:
                    type: string
                  oneTimePassword:
                    type: string
        '422':
          $ref: '#/components/responses/Problem'
  /admin/audit/search:
    post:
      tags:
        - audit
      operationId: searchAudit
      summary: API-040 Search audit log (FR-016)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditFilter'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '422':
          $ref: '#/components/responses/Problem'
  /admin/audit/export:
    post:
      tags:
        - audit
      operationId: exportAudit
      summary: API-041 Export audit log (async)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditFilter'
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /history/{recordType}/{recordId}:
    get:
      tags:
        - audit
      operationId: getRecordHistory
      summary: API-042 Record history (FR-016 AC2)
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/masters/{type}:
    parameters:
      - $ref: '#/components/parameters/MasterType'
    get:
      tags:
        - masters
      operationId: listMasterItems
      summary: API-045 List master items
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MasterItem'
                  nextCursor:
                    type:
                      - string
                      - 'null'
    post:
      tags:
        - masters
      operationId: createMasterItem
      summary: API-046 Create master item
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Per-type schema (LLD-masters TBL-031 – TBL-036)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterItem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
