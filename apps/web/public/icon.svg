<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1024"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="sphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6366f1" stroke-width="6" stroke-opacity="0.25" />
  
  <!-- Dynamic Sphere Orbit Mark -->
  <path d="M 256 100 A 156 156 0 1 1 146 366 A 120 120 0 1 0 256 150 Z" fill="url(#sphere)" filter="url(#glow)"/>
  
  <!-- Core Orbital Crescent -->
  <circle cx="270" cy="242" r="48" fill="#ffffff" fill-opacity="0.95" />
  <circle cx="292" cy="230" r="38" fill="#0c1024" />
</svg>
